version: 0.2
phases:
  install:
    commands:
      - echo "Installing dependencies..."
  pre_build:
    commands:
      - echo "Scanning with Trivy..."
      - trivy fs .
  build:
    commands:
      - echo "Building Docker image..."
      - docker build -t swiggy-app:latest .
  post_build:
    commands:
      - echo "Build completed on `date`"
