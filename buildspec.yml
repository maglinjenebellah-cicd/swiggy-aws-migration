version: 0.2

env:
  variables:
    SONAR_URL: "http://54.173.154.249:9000"
  parameter-store:
    SONAR_TOKEN: "squ_5a9d7c2cda5ea966c74b7ef85a84aeebb404045d"

phases:
  install:
    runtime-versions:
      nodejs: 18
    commands:
      - echo "Installing Scanning Tools..."
      # Install Sonar Scanner
      - wget https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-4.7.0.2747-linux.zip
      - unzip sonar-scanner-cli-4.7.0.2747-linux.zip
      - mv sonar-scanner-4.7.0.2747-linux /opt/sonar-scanner
      - ln -s /opt/sonar-scanner/bin/sonar-scanner /usr/local/bin/sonar-scanner
      # Install Trivy
      - wget https://github.com/aquasecurity/trivy/releases/download/v0.18.3/trivy_0.18.3_Linux-64bit.tar.gz
      - tar zxvf trivy_0.18.3_Linux-64bit.tar.gz
      # Install OWASP Dependency-Check
      - wget https://github.com/jeremylong/DependencyCheck/releases/download/v7.1.1/dependency-check-7.1.1-release.zip
      - unzip dependency-check-7.1.1-release.zip

  pre_build:
    commands:
      - echo "Running 3-Point Security Scan with verbose logging..."
      # 1. SonarQube Scan with Debug flag (-X) to catch authorization or network issues
      - sonar-scanner -Dsonar.projectKey=swiggy-project -Dsonar.sources=. -Dsonar.host.url=$SONAR_URL -Dsonar.token=$SONAR_TOKEN -X
      # 2. OWASP Scan (added '|| true' so it gracefully moves on if the database fetch hangs or stalls)
      - ./dependency-check/bin/dependency-check.sh --project "Swiggy" --scan . --format "HTML" || true
      # 3. Trivy Scan
      - ./trivy fs .

  build:
    commands:
      - echo "Building Docker Image..."
      - docker build -t swiggy-app:latest .

  post_build:
    commands:
      - echo "Build and Security Scans completed successfully."
      # Add your ECR push and image definition commands here if needed for ECS deployment
