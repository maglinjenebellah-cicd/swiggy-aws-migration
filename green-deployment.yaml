apiVersion: apps/v1
kind: Deployment
metadata:
  name: swiggy-app-green
spec:
  replicas: 2
  selector:
    matchLabels:
      app: swiggy-app-green
  template:
    metadata:
      labels:
        app: swiggy-app-green
    spec:
      containers:
      - name: swiggy-app
        image: us-central1-docker.pkg.dev/internal-sandbox-446612/swiggy-repo/swiggy-app:7ed7573
        ports:
        - containerPort: 80
