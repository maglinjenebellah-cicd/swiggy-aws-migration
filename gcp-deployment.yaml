apiVersion: apps/v1
kind: Deployment
metadata:
  name: swiggy-app-deployment
  labels:
    app: swiggy-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: swiggy-app
  template:
    metadata:
      labels:
        app: swiggy-app
    spec:
      containers:
        - name: swiggy-container
          image: us-central1-docker.pkg.dev/internal-sandbox-446612/swiggy-repo/swiggy-app:latest
          ports:
            - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: swiggy-lb-service
spec:
  type: LoadBalancer
  selector:
    app: swiggy-app
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3000

